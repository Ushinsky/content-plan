name: Refresh active catalog index

on:
  workflow_dispatch:
  push:
    paths:
      - reference/foroffice_models/active_catalog.csv
      - scripts/build_active_catalog_index.py
      - .github/workflows/refresh-active-catalog-index.yml
  schedule:
    # Europe/Kaliningrad is UTC+2; refresh three hours before the Monday digest.
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test catalog filter and shard generation
        run: python -m unittest discover -s tests -v

      - name: Generate active-product shards
        run: >-
          python scripts/build_active_catalog_index.py
          reference/foroffice_models/active_catalog.csv
          reference/foroffice_models/active_products

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/foroffice_models/active_products
          if git diff --cached --quiet; then
            echo "Active-product index is already current."
          else
            git commit -m "Refresh active product catalog index"
            git push
          fi

